# ─────────────────────────────────────────────────────────────────────────────
# Nginx configuration — Durga Digital Library (EC2 Ubuntu)
#
# Deploy location: /etc/nginx/sites-available/durga-library
# Symlink:         sudo ln -sf /etc/nginx/sites-available/durga-library \
#                              /etc/nginx/sites-enabled/durga-library
# Test:            sudo nginx -t
# Reload:          sudo systemctl reload nginx
# ─────────────────────────────────────────────────────────────────────────────

upstream durga_backend {
    # Node.js Express server managed by PM2
    server 127.0.0.1:3000;
    keepalive 64;
}

server {
    listen 80;
    listen [::]:80;

    # Replace with your domain or EC2 public IP
    # server_name 65.1.235.131 yourdomain.com www.yourdomain.com;
    server_name _;   # Matches any hostname — safe for IP-based access

    # ── Security headers ─────────────────────────────────────────────────────
    add_header X-Frame-Options       "SAMEORIGIN"     always;
    add_header X-Content-Type-Options "nosniff"       always;
    add_header X-XSS-Protection      "1; mode=block"  always;
    add_header Referrer-Policy       "strict-origin-when-cross-origin" always;

    # ── API: proxy to Node.js ────────────────────────────────────────────────
    location /api/ {
        proxy_pass         http://durga_backend;
        proxy_http_version 1.1;

        proxy_set_header Upgrade     $http_upgrade;
        proxy_set_header Connection  "upgrade";
        proxy_set_header Host        $host;
        proxy_set_header X-Real-IP   $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_cache_bypass $http_upgrade;
        proxy_buffering    off;

        # ── Timeouts — increase for slow MongoDB Atlas cold starts ──────────
        proxy_connect_timeout  75s;
        proxy_send_timeout    120s;
        proxy_read_timeout    120s;
    }

    # ── Health check (bypass rate limiter) ───────────────────────────────────
    location = /health {
        proxy_pass         http://durga_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        access_log off;
    }

    # ── React SPA (built client files) ───────────────────────────────────────
    location / {
        root       /var/www/durga-library-system/client/dist;
        index      index.html;
        try_files  $uri $uri/ /index.html;

        # Don't cache the HTML shell itself
        location = /index.html {
            add_header Cache-Control "no-cache, no-store, must-revalidate";
            add_header Pragma        "no-cache";
            add_header Expires       "0";
        }
    }

    # ── Static assets — long-lived cache (Vite adds content hashes) ─────────
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot|webp|avif)$ {
        root    /var/www/durga-library-system/client/dist;
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    # ── Gzip compression ─────────────────────────────────────────────────────
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_min_length 1024;
    gzip_comp_level 6;
    gzip_types
        text/plain
        text/css
        text/xml
        text/javascript
        application/javascript
        application/x-javascript
        application/json
        application/xml+rss
        image/svg+xml
        font/woff
        font/woff2;

    # ── Logging ───────────────────────────────────────────────────────────────
    access_log /var/log/nginx/durga-library-access.log;
    error_log  /var/log/nginx/durga-library-error.log warn;

    # ── Block hidden files ────────────────────────────────────────────────────
    location ~ /\. {
        deny all;
        access_log off;
        log_not_found off;
    }
}
